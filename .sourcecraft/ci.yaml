# CI/CD: запуск unit-тестов проекта rhythmic-gymnastics-assistant
on:
  push:
    - workflows: [run-tests]
      filter:
        branches: ["main"]
  pull_request:
    - workflows: [run-tests]
      filter:
        target_branches: "main"

workflows:
  run-tests:
    tasks:
      - name: run-tests-task
        cubes:
          - name: run-tests
            image: docker.io/library/python:3.12-slim
            script:
              # Системные библиотеки для OpenCV (libxcb, X11 и т.д.) в slim-образе отсутствуют
              - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxcb1 libx11-6 libxext6 libsm6 libxrender1
              - python -m pip install --upgrade pip
              - pip install -r requirements.txt
              # Модель PoseLandmarker: скачивание с фиксацией и проверкой SHA-256 (supply-chain pin)
              - python scripts/download_pose_model.py
              - python test_main.py